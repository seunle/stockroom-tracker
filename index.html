/* ============================= DISPLAY TAB: DRAFT CHECK POPUP ============================= */
// Adjustments here are held locally as a draft and only written to the
// sheet (and only marked as "session checked") when Done is pressed.
// Pressing X or tapping outside discards everything — nothing is sent.
let displayDraft = null;      // { rowId: { original, current, minCount } }
let displayDraftGroupKey = null;
let displayDraftLocation = null; // location code the popup was opened for — used for the location-scoped checked key
function openDisplayCheck(key){
  if(locationFilter==='All'){
    toast(t('selectLocationDisplay'), true);
    return;
  }
  const displayField = DISPLAY_FIELD_BY_CODE[locationFilter];
  const groups = buildGroups(activeRows());
  const g = groups.find(x=>x.key===key);
  if(!g) return;
  displayDraftGroupKey = key;
  displayDraftLocation = locationFilter;
  displayDraft = {};
  Object.values(g.rows).forEach(row=>{
    displayDraft[row.ID] = { original:Number(row[displayField]||0), current:Number(row[displayField]||0), minCount:Number(row[MIN_COUNT_FIELD_BY_CODE[locationFilter]]||0) };
  });
  openSheetHtml(`
    <div style="margin-bottom:4px; padding-right:50px;">
      <h2 style="margin:0 0 1px 0;">${esc(g.name)}</h2>
      <div class="desc" style="margin:0;">${esc(g.type)} · ${esc(g.location)} · ${t('editingDisplay')} <b>${esc(LOC_NAME_BY_CODE[locationFilter])}</b></div>
    </div>
    <div class="detail-wrap">
      <div class="detail-photo">${g.photo?`<img src="${esc(g.photo)}">`:''}</div>
      <div class="size-grid">
        ${SIZES.map(sz=>{
          const row = g.rows[sz];
          if(!row) return `<div class="size-col" style="opacity:0.3;"><div class="size-label">${SIZE_SHORT_LABEL[sz]}</div><div class="size-count">—</div></div>`;
          const d = displayDraft[row.ID];
          const belowMin = d.current < d.minCount;
          return `
            <div class="size-col">
              <div class="size-label">${SIZE_SHORT_LABEL[sz]}</div>
              <div class="size-count ${belowMin?'low':''}" id="cnt-${row.ID}">${d.current}</div>
              <button class="size-plus" onclick="stepDisplayDraft('${row.ID}',1)">+</button>
              <button class="size-minus" onclick="stepDisplayDraft('${row.ID}',-1)">−</button>
              <div class="size-min">${t('minLabel')} ${d.minCount}</div>
            </div>`;
        }).join('')}
      </div>
    </div>
    <div class="sheet-actions" style="margin-top:16px;">
      <button class="btn-check-toggle${sessionCheckedKeys.has(sessionCheckKey(locationFilter,key))?' on':''}" id="displayCheckToggle" onclick="toggleCheckedAndClose('${esc(key)}','${locationFilter}')">✓</button>
      <button class="btn btn-confirm btn-wide3" onclick="commitDisplayCheck()">${t('doneBtn')}</button>
    </div>
  `, 'display');
  scrollSheetToBottom();
}
// Opens a popup already scrolled to the bottom instead of the top — used
// where the actionable buttons sit at the bottom and content above them
// can run taller than the popup on phone. Double rAF: right after the
// overlay switches from display:none to flex, layout/paint hasn't happened
// yet, so scrollHeight can still read as the old (collapsed) size. Waiting
// two animation frames guarantees the browser has laid out and painted the
// new content first.
function scrollSheetToBottom(){
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const scrollEl = document.querySelector('#sheetContent .sheet-scroll');
      if(scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
    });
  });
}
function stepDisplayDraft(id, delta){
  const d = displayDraft && displayDraft[id];
  if(!d) return;
  d.current = Math.max(0, d.current + delta);
  const el = document.getElementById('cnt-'+id);
  if(el){ el.textContent = d.current; el.classList.toggle('low', d.current < d.minCount); }
}
async function commitDisplayCheck(){
  const draft = displayDraft, groupKeyForDraft = displayDraftGroupKey, locForDraft = displayDraftLocation;
  const displayField = DISPLAY_FIELD_BY_CODE[locForDraft];
  const onHoldField = ON_HOLD_FIELD_BY_CODE[locForDraft];
  const resupplyField = RESUPPLY_FIELD_BY_CODE[locForDraft];
  const storageField = STORAGE_FIELD_BY_CODE[locForDraft];
  displayDraft = null; displayDraftGroupKey = null; displayDraftLocation = null;
  closeSheet();
  if(!draft) return;
  const changedIds = Object.keys(draft).filter(id => draft[id].current !== draft[id].original);

  // For every size in this popup, check whether ANY location already has
  // this item On Hold (not just the location currently being reviewed).
  // If so, any DECREASE made in THIS session (original minus current —
  // not the total gap below Min Count, which would keep re-adding the
  // same amount every time this popup is reopened even with no change
  // made) is folded straight into the CURRENTLY REVIEWED location's own
  // On Hold count instead of ever flagging Storage or Resupply — once On
  // Hold has started on an item ANYWHERE (from the Resupply tab), it
  // fully owns that item at every location until resolved there;
  // the Display popup must never re-surface it in Storage on its own.
  const onHoldUpdates = {}; // id -> new On Hold value for this location
  Object.keys(draft).forEach(id=>{
    const row = rows.find(r=>sameId(r.ID,id));
    if(!row) return;
    // Once ANY location has this item on hold, the whole item is treated
    // as on-hold-eligible — a decrease at a DIFFERENT location (even one
    // that's never been on hold itself, still at 0) increments THAT
    // location's own On Hold field instead of going to Resupply.
    const anyLocationOnHold = ['T','P','B'].some(c => Number(row[ON_HOLD_FIELD_BY_CODE[c]]||0) > 0);
    if(!anyLocationOnHold) return; // no location has this on hold yet — Resupply check below applies instead
    const currentOnHold = Number(row[onHoldField]||0); // this location's own value — may itself still be 0
    const decrease = Math.max(0, draft[id].original - draft[id].current);
    if(decrease > 0) onHoldUpdates[id] = Math.min(5, currentOnHold + decrease); // backend caps On Hold at 5
  });

  // Same idea, one tier down: for anything NOT already On Hold, check
  // whether this location already has an outstanding Resupply request
  // (Resupply column > 0). If so, any DECREASE made in THIS session gets
  // added onto that Resupply number instead of ever flagging Storage — an
  // item already sitting in the Resupply tab's queue for this location
  // shouldn't also get flagged in Storage as if nobody had asked for it yet.
  const resupplyIncrements = {}; // id -> amount to add to this location's Resupply value
  Object.keys(draft).forEach(id=>{
    if(onHoldUpdates[id] !== undefined) return; // On Hold already claimed this one
    const row = rows.find(r=>sameId(r.ID,id));
    if(!row) return;
    const currentResupply = Number(row[resupplyField]||0);
    if(currentResupply <= 0) return; // no outstanding request — normal Storage-trigger logic applies below
    const decrease = Math.max(0, draft[id].original - draft[id].current);
    if(decrease > 0) resupplyIncrements[id] = decrease;
  });

  // Build ONE combined update per reviewed size, covering everything —
  // Display value, Storage eligibility, On Hold redirect, Resupply
  // redirect — and send it as a SINGLE request. This used to be up to one
  // network round trip PER size PER concern (a 7-size item could mean
  // 8-10+ sequential calls before the UI settled); now it's exactly one,
  // regardless of how many sizes were reviewed.
  const reviewUpdates = Object.keys(draft).map(id=>{
    const u = { id };
    if(changedIds.includes(id)) u.displayValue = draft[id].current;
    if(onHoldUpdates[id] !== undefined){
      u.onHold = onHoldUpdates[id];
      u.storageActive = 0;
    }else if(resupplyIncrements[id] !== undefined){
      u.resupplyIncrement = resupplyIncrements[id];
      u.storageActive = 0;
    }else{
      u.storageActive = (draft[id].current >= Number(draft[id].minCount||0)) ? 0 : 1;
    }
    return u;
  });

  const affectedIds = Object.keys(draft);
  if(affectedIds.length>0){
    pushUndoSnapshot(affectedIds); // one batch undo covering Display, On Hold, Resupply, and Storage changes from this check
    // Optimistic local updates, matching what the server is about to do.
    reviewUpdates.forEach(u=>{
      const row = rows.find(r=>sameId(r.ID,u.id));
      if(!row) return;
      if(u.displayValue!==undefined) row[displayField] = u.displayValue;
      if(u.storageActive!==undefined) row[storageField] = u.storageActive;
      if(u.onHold!==undefined) row[onHoldField] = u.onHold;
      if(u.resupplyIncrement) row[resupplyField] = Number(row[resupplyField]||0) + u.resupplyIncrement;
    });
  }
  // Pressing Done always marks the item checked now — the separate
  // "force checked without changes" button doesn't exist anymore, that
  // role is covered by the standalone checkmark toggle instead.
  sessionCheckedKeys.add(sessionCheckKey(locForDraft, groupKeyForDraft));
  // Show the grey/Checked state RIGHT NOW — the local data above is
  // already correct, so there's no reason to wait on the network before
  // rendering it. Previously this only happened after the awaited apiPost
  // below (and, before that, an even later refresh()), so nothing visibly
  // changed until two full round trips had completed — which is exactly
  // what was taking ~4 seconds.
  render();
  toast(t('checkedToast'));
  if(affectedIds.length>0){
    const res = await apiPost({action:'commitDisplayReview', location:locForDraft, updates:reviewUpdates});
    if(!res.ok){
      toast(t('saveFailed') + (res.error||t('unknownError')), true);
      refresh(false); // the write failed — the optimistic state above may be wrong, resync with the server's real data
    }
    // On success, deliberately NOT calling refresh() — same reasoning as
    // the drag-reorder fix: the write and a fresh read are two separate
    // requests with no guaranteed instant consistency between them, and
    // the optimistic local state is already correct.
  }
}

// The standalone checkmark toggle — a quick way to flip an item's checked
// status without doing a full review. Deliberately discards any pending
// size draft (same "closing without Done/Request discards changes"
// philosophy as X or tapping outside) and closes immediately.
function toggleCheckedAndClose(groupKey, code){
  const key = sessionCheckKey(code, groupKey);
  if(sessionCheckedKeys.has(key)) sessionCheckedKeys.delete(key);
  else sessionCheckedKeys.add(key);
  displayDraft = null; displayDraftGroupKey = null; displayDraftLocation = null;
  requestDraft = null; requestDraftGroupKey = null; requestDraftLocation = null;
  closeSheet();
  render();
}

/* ============================= REQUEST TAB: ITEM POPUP (Hoodie category) ============================= */
// Hoodie items skip the whole Display/Storage pipeline entirely — this
// popup always starts every active size at 0 (never shows a current
// stock count, since Display isn't used for Hoodies at all) and adds
// whatever's entered straight onto Resupply (or On Hold, if that
// location already has some) the instant Request is pressed. No
// diminishing-returns math, no Display writes.
function openRequestCheck(key){
  if(locationFilter==='All'){
    toast(t('selectLocationDisplay'), true);
    return;
  }
  const groups = buildGroups(activeRows());
  const g = groups.find(x=>x.key===key);
  if(!g) return;
  requestDraftGroupKey = key;
  requestDraftLocation = locationFilter;
  requestDraft = {};
  const activeSizesPresent = HOODIE_SIZES.filter(sz=>g.rows[sz]);
  activeSizesPresent.forEach(sz=>{
    requestDraft[g.rows[sz].ID] = { current: 0, size: sz };
  });
  openSheetHtml(`
    <div class="request-popup">
    <div style="margin-bottom:4px; padding-right:50px;">
      <h2 style="margin:0 0 1px 0;">${esc(g.name)}</h2>
      <div class="desc" style="margin:0;">${esc(g.type)} · ${esc(g.location)} · ${t('editingDisplay')} <b>${esc(LOC_NAME_BY_CODE[locationFilter])}</b></div>
    </div>
    <div class="detail-wrap">
      <div class="detail-photo">${g.photo?`<img src="${esc(g.photo)}">`:''}</div>
      <div class="size-grid">
        ${activeSizesPresent.map(sz=>{
          const row = g.rows[sz];
          return `
            <div class="size-col">
              <div class="size-label zero-val" id="reqlabel-${row.ID}">${SIZE_SHORT_LABEL[sz]}</div>
              <input type="number" class="size-count-input zero-val" id="req-${row.ID}" value="0" readonly>
              <button type="button" class="size-plus" onclick="stepRequestDraft('${row.ID}',1)">+</button>
              <button type="button" class="size-minus" onclick="stepRequestDraft('${row.ID}',-1)">−</button>
            </div>`;
        }).join('')}
      </div>
    </div>
    <div class="sheet-actions" style="margin-top:16px;">
      <button class="btn-check-toggle${sessionCheckedKeys.has(sessionCheckKey(locationFilter,key))?' on':''}" onclick="toggleCheckedAndClose('${esc(key)}','${locationFilter}')">✓</button>
      <button class="btn btn-confirm btn-wide3 btn-request-submit" onclick="commitRequestCheck()">${t('requestBtn')}</button>
    </div>
    </div>
  `, 'display');
  scrollSheetToBottom();
}
function stepRequestDraft(id, delta){
  const d = requestDraft && requestDraft[id];
  if(!d) return;
  d.current = Math.max(0, d.current + delta);
  const input = document.getElementById('req-'+id);
  const label = document.getElementById('reqlabel-'+id);
  const isZero = d.current === 0;
  if(input){ input.value = d.current; input.classList.toggle('zero-val', isZero); }
  if(label){ label.classList.toggle('zero-val', isZero); }
}
async function commitRequestCheck(){
  const draft = requestDraft, groupKeyForDraft = requestDraftGroupKey, locForDraft = requestDraftLocation;
  requestDraft = null; requestDraftGroupKey = null; requestDraftLocation = null;
  closeSheet();
  if(!draft) return;
  const resupplyField = RESUPPLY_FIELD_BY_CODE[locForDraft];
  const onHoldField = ON_HOLD_FIELD_BY_CODE[locForDraft];
  const requests = Object.keys(draft).filter(id=>draft[id].current>0).map(id=>({id, qty:draft[id].current}));

  // Pressing Request always marks the item checked, even if every size was
  // left at 0 — same "visual feedback that it was a success" idea as Done.
  sessionCheckedKeys.add(sessionCheckKey(locForDraft, groupKeyForDraft));

  if(requests.length===0){
    render();
    toast(t('checkedToast'));
    return;
  }

  pushUndoSnapshot(requests.map(r=>r.id));
  // Optimistic local update, mirroring exactly what the backend will do:
  // if this location already has some On Hold for a row, the request adds
  // there instead of Resupply.
  requests.forEach(r=>{
    const row = rows.find(x=>sameId(x.ID,r.id));
    if(!row) return;
    const currentOnHold = Number(row[onHoldField]||0);
    if(currentOnHold>0){ row[onHoldField] = Math.min(5, currentOnHold + r.qty); }
    else{ row[resupplyField] = Number(row[resupplyField]||0) + r.qty; }
  });
  render();
  toast(t('requestSentToast'));
  const res = await apiPost({action:'requestHoodieSizes', location:locForDraft, requests});
  if(!res.ok){
    toast(t('saveFailed') + (res.error||t('unknownError')), true);
    refresh(false);
  }
}

/* ============================= RESUPPLY TAB: PER-LOCATION ROWS ============================= */
const RESUPPLY_FIELD_BY_CODE = { T:'ResupplyTangle', P:'ResupplyParkway', B:'ResupplyBears' };
const DISPLAY_FIELD_BY_CODE = { T:'DisplayTangle', P:'DisplayParkway', B:'DisplayBears' };
const ON_HOLD_FIELD_BY_CODE = { T:'OnHoldTangle', P:'OnHoldParkway', B:'OnHoldBears' };
const MIN_COUNT_FIELD_BY_CODE = { T:'MinCountTangle', P:'MinCountParkway', B:'MinCountBears' };
const ORDER_FIELD_BY_CODE = { T:'OrderTangle', P:'OrderParkway', B:'OrderBears' };
// Custom per-location Display order, set via drag-and-drop in the Edit tab.
// Reads any row in the group — a group's rows always carry the same order
// value for a given location, since reordering writes it to every size row
// in the group at once. Returns null if this group has never been
// manually positioned for this location.
function groupOrderValue(g, code){
  if(!code || code==='All' || !ORDER_FIELD_BY_CODE[code]) return null;
  const field = ORDER_FIELD_BY_CODE[code];
  for(const r of Object.values(g.rows)){
    const v = r[field];
    if(v !== null && v !== undefined && v !== '') return Number(v);
  }
  return null;
}
// Sorts groups by their custom order for the given location, when at least
// one group in the list actually has one set. Groups without an explicit
// order sink after ones that do, but otherwise keep their original
// relative order (stable sort) — so a location nobody has ever manually
// arranged behaves exactly like before this feature existed.
function applyCustomOrder(groups, code){
  if(!code || code==='All') return groups;
  const hasAnyOrder = groups.some(g => groupOrderValue(g, code) !== null);
  if(!hasAnyOrder) return groups;
  return groups.slice().sort((a,b)=>{
    const oa = groupOrderValue(a, code), ob = groupOrderValue(b, code);
    if(oa===null && ob===null) return 0;
    if(oa===null) return 1;
    if(ob===null) return -1;
    return oa-ob;
  });
}
const LOC_NAME_BY_CODE = { T:'Tangle', P:'Parkway', B:'Bears' };
const ON_HOLD_CODE = 'H'; // not a real location — a pseudo-row/filter, treated identically to T/P/B now
let resupplyRowOrder = ['T','P','B',ON_HOLD_CODE]; // rotated by the rotate button — governs the COLLAPSED rows' order (the active one is excluded from that list, shown as the main grid instead)
const LOC_FILTER_CHIP_ORDER = ['T','P','B']; // filter chip order — deliberately never reordered by Rotate, always Tangle/Parkway/Bears
// Only one location (or On Hold) is ever expanded at a time — clicking a
// chip makes it the sole active one; every other location collapses to a
// simple label+count row below (those rows are now display-only — see
// resupplyRowHtml, clicking them no longer switches location).
let activeResupplyLocation = 'T';
// Remembers the last REAL (non On Hold) location that was active, so
// pressing the On Hold chip again while it's already active can toggle
// back to wherever you actually were, instead of just staying on hold.

function resupplyItemsForCode(code){

    </div>`;

  // FLIP animate: measure surviving cards' new positions and slide them in
  // from their old spot. Cards with no "before" entry are genuinely new
  // and just appear as-is — only cards that were already visible and moved

  if(activeItems.length>0){

      document.querySelectorAll('#resupplyGrid [data-card-key]').forEach(el=>{

          el.style.transform = 'translate(0,0)';
        });

    });
  }
}

  const onHold = ['T','P','B'].reduce((sum,c)=>sum+Number(row[ON_HOLD_FIELD_BY_CODE[c]]||0),0);

// FLIP animation: capture each collapsed row's current on-screen position,
// apply the state change and re-render, then animate every row from where
// it used to be to where it landed — gives a real slide instead of an
// instant snap. Chips no longer move (fixed order), but the check stays
// harmless in case that ever changes.
function animateResupplyRowChange(mutateFn){
  const container = document.getElementById('resupplyCollapsedRows');
  const before = {};
  if(container){
    container.querySelectorAll('[data-loc-row]').forEach(el=>{
      before[el.dataset.locRow] = el.getBoundingClientRect().top;
    });
  }
  const chipsBefore = {};
  document.querySelectorAll('[data-loc-chip]').forEach(el=>{
    chipsBefore[el.dataset.locChip] = el.getBoundingClientRect().left;
  });
  mutateFn();
  render();
  requestAnimationFrame(()=>{
    // getBoundingClientRect() measures on-screen (post-scale) pixels, but
    // these rows/chips live inside #uiShell, which is visually scaled via
    // CSS transform for the UI Scale setting. A transform applied to a
    // descendant of a scaled ancestor is interpreted in LOCAL (pre-scale)
    // units, then gets scaled again on top when rendered — so a raw
    // screen-pixel delta ends up displayed at roughly (delta × scale) of
    // its intended distance. Dividing by the current scale here corrects
    // for that, so the slide animation covers the actual visual gap
    // instead of over/undershooting it at any UI Scale other than 100%.
    const uiScale = state.uiScale || 1;
    const newContainer = document.getElementById('resupplyCollapsedRows');
    if(newContainer){
      newContainer.querySelectorAll('[data-loc-row]').forEach(el=>{
        const code = el.dataset.locRow;
        if(before[code]===undefined) return;
        const delta = (before[code] - el.getBoundingClientRect().top) / uiScale;
        if(Math.abs(delta) < 1) return;
        el.style.transition = 'none';
        el.style.transform = `translateY(${delta}px)`;
        requestAnimationFrame(()=>{
          el.style.transition = 'transform 0.32s cubic-bezier(0.4,0,0.2,1)';
          el.style.transform = 'translateY(0)';
        });
      });
    }
    document.querySelectorAll('[data-loc-chip]').forEach(el=>{
      const code = el.dataset.locChip;
      if(chipsBefore[code]===undefined) return;
      const delta = (chipsBefore[code] - el.getBoundingClientRect().left) / uiScale;
      if(Math.abs(delta) < 1) return;
      el.style.transition = 'none';
      el.style.transform = `translateX(${delta}px)`;
      requestAnimationFrame(()=>{
        el.style.transition = 'transform 0.32s cubic-bezier(0.4,0,0.2,1)';
        el.style.transform = 'translateX(0)';
      });
    });
  });
}
// Makes the tapped location (or On Hold — all four are treated identically
// now) the sole active/expanded one. Its items take over the main grid;
// whatever was previously active collapses back down into the label+count
// row list below.
function selectResupplyLocation(code){
  if(code===ON_HOLD_CODE){
    if(activeResupplyLocation===ON_HOLD_CODE){
      // Already on On Hold — pressing it again toggles back to wherever
      // you actually were before switching to On Hold.
      const back = resupplyPrevLocation;
      animateResupplyRowChange(()=>{ activeResupplyLocation = back; });
      return;
    }
    animateResupplyRowChange(()=>{ activeResupplyLocation = ON_HOLD_CODE; });
    return;
  }
  if(activeResupplyLocation===code) return;
  resupplyPrevLocation = code; // remember this as the "back" target for the next On Hold toggle
  animateResupplyRowChange(()=>{
    activeResupplyLocation = code;
  });
}
// "Change" jumps the active selection straight to the next location that
// actually has items (On Hold never included — this only ever swaps
// between real locations) — cycling back and forth between however many
// are populated. Reuses selectResupplyLocation() so the chip highlight,
// the FLIP slide, and everything else stays exactly consistent with
// tapping a chip directly.
function nextResupplyLocation(){
  const withItems = resupplyRowOrder.filter(code => code!==ON_HOLD_CODE && resupplyItemsFor(code).length > 0);
  if(withItems.length === 0) return; // no location (excluding On Hold) has items right now
  const currentIdx = withItems.indexOf(activeResupplyLocation);
  const nextCode = withItems[(currentIdx === -1 ? 0 : currentIdx + 1) % withItems.length];
  selectResupplyLocation(nextCode);
}

// On Hold resolve popup — the ONLY popup opened from tapping an On Hold
// card in the Resupply tab. Shows all 3 locations side by side (T/P/B),
// each with its current On Hold value and its own stepper. Every stepper
// starts equal to that location's current On Hold value — leaving it
// untouched and pressing "In Stock" means "all of these came in", clearing
// that location's hold to 0. Pulling the stepper down means "only this
// many came in"; the rest stays on hold. Formula per location:
//   new On Hold = original On Hold − stepper's final value
// This is a completely separate popup from openResupplyItem — it never
// touches the regular per-location Resupply popup used elsewhere in this tab.
let onHoldResolveContext = null; // { id, original: {T,P,B} }
// Adaptive font size for the On Hold popup's size badge — short labels
// (S, M, L) get a big font since there's plenty of room; longer ones
// (2XL, 3XL) get progressively smaller so they never clip the box.
// Uses clamp() so it still scales with the popup's own width on top of
// the length-based tier, same responsive approach used elsewhere.
function onHoldBadgeFontSize(sizeKey){
  const label = SIZE_SHORT_LABEL[sizeKey] || sizeKey || '';
  const len = label.length;
  if(len<=1) return 'clamp(30px, 11cqw, 46px)';
  if(len===2) return 'clamp(24px, 9cqw, 36px)';
  return 'clamp(18px, 6.5cqw, 27px)'; // 3+ chars, e.g. 2XL / 3XL
}
function openOnHoldItem(id){
  const row = rows.find(r=>sameId(r.ID,id));
  if(!row) return;
  const original = {
    T: Number(row.OnHoldTangle||0),
    P: Number(row.OnHoldParkway||0),
    B: Number(row.OnHoldBears||0)
  };
  onHoldResolveContext = { id, original };
  const photo = row.Photo ? `<img src="${esc(row.Photo)}">` : '';
  openSheetHtml(`
    <h2 style="margin:0 0 2px;">${esc(row.Name)}</h2>
    <div class="desc" style="margin:0 0 12px;">${esc(row.Type)} · ${t('onHold')}</div>
    <div class="onhold-photo-full">${photo}</div>
    <div class="onhold-resolve-cols">
      <div class="onhold-col onhold-size-col">
        <div class="onhold-col-label" style="visibility:hidden;">T</div>
        <div class="onhold-size-badge" style="font-size:${onHoldBadgeFontSize(row.Size)};">${esc(SIZE_SHORT_LABEL[row.Size]||row.Size)}</div>
      </div>
      ${['T','P','B'].map(code=>`
        <div class="onhold-col">
          <div class="onhold-col-label">${code}</div>
          <div class="onhold-value-box">${original[code]}</div>
          <button type="button" class="size-plus" onclick="stepOnHoldResolve('${code}',1)">+</button>
          <div class="size-count" id="onHoldResolve-${code}">${original[code]}</div>
          <button type="button" class="size-minus" onclick="stepOnHoldResolve('${code}',-1)">−</button>
        </div>`).join('')}
    </div>
    <button class="btn-resupply" onclick="submitOnHoldResolve()">${t('stockBtn')}</button>
  `, 'restock');
  scrollSheetToBottom();
}
function stepOnHoldResolve(code, delta){
  if(!onHoldResolveContext) return;
  const el = document.getElementById('onHoldResolve-'+code);
  if(!el) return;
  // Clamped between 0 and that location's original On Hold value — the
  // stepper represents "how many of the original on-hold amount are now
  // in stock", so it can never go negative or exceed what was on hold.
  const max = onHoldResolveContext.original[code];
  const current = Number(el.textContent||0);
  const next = Math.max(0, Math.min(max, current+delta));
  el.textContent = next;
  // Below the original On Hold value means some of it will still be
  // unresolved after Stock is pressed — flag that visually.
  el.classList.toggle('onhold-partial', next < max);
}
async function submitOnHoldResolve(){
  if(!onHoldResolveContext) return;
  const { id, original } = onHoldResolveContext;
  const row = rows.find(r=>sameId(r.ID,id));
  onHoldResolveContext = null;
  if(!row){ closeSheet(); return; }
  const updates = {};
  ['T','P','B'].forEach(code=>{
    const el = document.getElementById('onHoldResolve-'+code);
    const stepperVal = el ? Number(el.textContent||0) : 0;
    const newOnHold = Math.max(0, original[code] - stepperVal);
    if(newOnHold !== original[code]) updates[code] = newOnHold;
  });
  const changedCodes = Object.keys(updates);
  if(changedCodes.length===0){ closeSheet(); return; }
  const isHoodieRow = row.Type === HOODIE_TYPE;
  pushUndoSnapshot([id]);
  pendingSubmitIds.add(String(id));
  closeSheet();
  render(); // immediately dims/disables the card on the now-visible On Hold row
  toast(t('saving'));
  for(const code of changedCodes){
    // The amount being resolved for THIS location (original minus what's
    // left on hold) is credited onto THIS location's own Display count,
    // capped at THIS location's own Min Count — same rule as the regular
    // per-location Resupply popup, just applied per column here since one
    // On Hold item can span all three locations at once. Hoodie items
    // skip this — they never use Display at all.
    const stepperVal = original[code] - updates[code];
    row[ON_HOLD_FIELD_BY_CODE[code]] = updates[code];
    let newDisplay;
    if(!isHoodieRow){
      const minCount = Number(row[MIN_COUNT_FIELD_BY_CODE[code]]||0);
      const currentDisplay = Number(row[DISPLAY_FIELD_BY_CODE[code]]||0);
      newDisplay = Math.min(minCount, currentDisplay + stepperVal);
      row[DISPLAY_FIELD_BY_CODE[code]] = newDisplay;
    }
    await apiPost({action:'setResupplyForLocation', id, location:code, onHold:updates[code], displayValue:newDisplay});
  }
  toast(t('updated'));
  pendingSubmitIds.delete(String(id));
  refresh(false);
}
// open, so the stepper can live-update the On Hold preview and Done can
// compute the same shortfall it just showed. Cleared on close/submit.
let resupplyEditContext = null; // { id, code, requiredQty }

function openResupplyItem(id, code){
  const row = rows.find(r=>sameId(r.ID,id));
  if(!row) return;

  // IMPORTANT: Popup NEED is ONLY the selected location's Resupply field.
  // Tangle -> ResupplyTangle, Parkway -> ResupplyParkway, Bears -> ResupplyBears.
  // It must never be calculated from Min Count, Display, or On Hold.
  const field = RESUPPLY_FIELD_BY_CODE[code];
  const requiredQty = Number(row[field] || 0);
  const current = Math.min(6, requiredQty); // stepper is capped at 6 — any excess above that shows as On Hold below

  // On Hold is the shortfall between the original location-specific
  // Resupply requirement and the quantity currently shown in the stepper.
  const onHoldPreview = Math.min(5, Math.max(0, requiredQty - current));
  resupplyEditContext = { id, code, requiredQty };

  const photo = row.Photo ? `<img src="${esc(row.Photo)}">` : '';
  openSheetHtml(`
    <div class="resupply-edit-name">${esc(row.Name)}</div>
    <div class="resupply-edit-meta">${esc(LOC_NAME_BY_CODE[code])}: ${esc(row.Type)} · ${esc(SIZE_FULL_NAMES[row.Size]||row.Size)}</div>
    <div class="resupply-edit-photo">${photo}</div>
    <div class="resupply-edit-nh-grid">
      <div class="resupply-edit-nh-label" style="grid-column:span 2;">${t('need')}</div>
      <div class="resupply-edit-nh-label resupply-edit-hold-label">${t('hold')}</div>
      <div class="resupply-edit-nh-box">${esc(SIZE_SHORT_LABEL[row.Size]||row.Size)}</div>
      <div class="resupply-edit-nh-box">${requiredQty}</div>
      <div class="resupply-edit-nh-box resupply-edit-hold-box" id="onHoldNum">${formatHoldDisplay(onHoldPreview)}</div>
    </div>
    <div class="resupply-edit-divider"></div>
    <div class="restock-request-label">${t('resupplyFor')} ${esc(LOC_NAME_BY_CODE[code])}</div>
    <div class="restock-request-stepper xl">
      <button type="button" class="rq-minus" onclick="stepResupplyEdit(-1)">−</button>
      <input type="number" id="resupplyEditQty" value="${current}" readonly>
      <button type="button" class="rq-plus" onclick="stepResupplyEdit(1)">+</button>
    </div>
    <button class="btn-resupply" onclick="submitResupplyEdit()">${t('resupplyBtn')}</button>
  `, 'restock');
  scrollSheetToBottom();
}

function stepResupplyEdit(delta){
  const el = document.getElementById('resupplyEditQty');
  el.value = Math.max(0, Math.min(6, Number(el.value||0)+delta));
  updateOnHoldPreview();
}

// Displays the Hold value as a negative for visual clarity ("-2" instead
// of "2") — purely cosmetic, the underlying math and the value actually
// saved to the sheet are completely unchanged, still a plain positive
// number. Zero stays "0", never "-0". Formatted as ONE string (sign+digit
// together) rather than separate elements, so the box's existing flex
// centering keeps the sign and number centered as a single unit instead of
// the sign looking like it's off to the side.
function formatHoldDisplay(n){
  return n > 0 ? ('-' + n) : '0';
}
function updateOnHoldPreview(){
  if(!resupplyEditContext) return;
  const value = Number(document.getElementById('resupplyEditQty').value||0);
  // ON HOLD = location's original Resupply quantity - on-screen quantity.
  // Never allow a negative value and cap the stored/displayed amount at 5.
  const onHold = Math.min(5, Math.max(0, resupplyEditContext.requiredQty - value));
  const el = document.getElementById('onHoldNum');
  if(el) el.textContent = formatHoldDisplay(onHold);
}

async function submitResupplyEdit(){
  if(!resupplyEditContext) return;
  const { id, code, requiredQty } = resupplyEditContext;
  const value = Number(document.getElementById('resupplyEditQty').value||0);
  const onHold = Math.min(5, Math.max(0, requiredQty - value));
  const row = rows.find(r=>sameId(r.ID,id));
  resupplyEditContext = null;
  if(!row){ closeSheet(); return; }

  // The resupplied quantity is credited onto this location's Display
  // count too, capped at this location's own Min Count — e.g. Display at
  // 1 with a Min Count of 3: entering 5 and pressing Resupply adds only
  // the 2 needed to reach 3, not the full 5; entering 1 adds all of it
  // since 1+1=2 doesn't reach the cap. Hoodie items skip this entirely —
  // they never use Display at all, so there's nothing to credit.
  const isHoodieRow = row.Type === HOODIE_TYPE;
  const minCount = Number(row[MIN_COUNT_FIELD_BY_CODE[code]]||0);
  const currentDisplay = Number(row[DISPLAY_FIELD_BY_CODE[code]]||0);
  const newDisplay = Math.min(minCount, currentDisplay + value);

  pushUndoSnapshot([id]);
  pendingSubmitIds.add(String(id));
  closeSheet();
  render(); // immediately dims/disables the card on the now-visible grid, before the API round-trip even starts
  toast(t('saving'));

  // Done must not alter Resupply beyond closing it out. Only write the
  // selected location's On Hold field when a shortfall actually applies,
  // and always credit the Display count for this location — except for
  // Hoodies, which never touch Display.
  if(onHold > 0){
    row[ON_HOLD_FIELD_BY_CODE[code]] = onHold;
  }
  if(!isHoodieRow) row[DISPLAY_FIELD_BY_CODE[code]] = newDisplay;

  const res = await apiPost({
    action:'setResupplyForLocation',
    id,
    location:code,
    onHold,
    applyOnHold: onHold > 0,
    displayValue: isHoodieRow ? undefined : newDisplay
  });
  toast(res.ok ? t('saved') : t('saveFailed') + (res.error||t('unknownError')), !res.ok);
  pendingSubmitIds.delete(String(id));
  refresh(false);
}

async function submitResupply(id){
  if(locationFilter==='All'){
    toast(t('selectLocationResupply'), true);
    return;
  }
  const row = rows.find(r=>sameId(r.ID,id));
  if(!row) return;
  const requestQty = Number(document.getElementById('requestQty').value||0);
  const onHoldField = ON_HOLD_FIELD_BY_CODE[locationFilter];
  const currentOnHold = Number(row[onHoldField]||0);
  pushUndoSnapshot([id]); // so a premature press can be undone (reverts Display/Resupply/On Hold)
  pendingSubmitIds.add(String(id));
  closeSheet();
  render(); // immediately dims/disables the card on the now-visible grid, before the API round-trip even starts

  if(currentOnHold > 0){
    // This item is already On Hold for this location — a resupply request
    // here does NOT go to Storage/Display at all (no Display bump, no
    // Resupply column write). It just adds the requested quantity onto
    // the existing On Hold amount for this location, capped at 5 (matching
    // the backend's own cap on the On Hold column).
    toast(t('addingToHold'));
    const newOnHold = Math.min(5, currentOnHold + requestQty);
    row[onHoldField] = newOnHold;
    const res = await apiPost({action:'setResupplyForLocation', id, location:locationFilter, onHold:newOnHold});
    toast(res.ok ? `${t('onHoldForNowIs')} ${LOC_NAME_BY_CODE[locationFilter]} ${t('isNow')} ${newOnHold}` : t('couldNotUpdateHold') + (res.error||t('unknownError')), !res.ok);
    pendingSubmitIds.delete(String(id));
    refresh(false);
    return;
  }

  toast(t('requesting'));
  const res = await apiPost({action:'requestResupply', id, requestQty, location:locationFilter});
  if(res.ok){
    toast(`${t('resupplyRequestedFor')} ${LOC_NAME_BY_CODE[locationFilter]} ${t('displayPlus')}${res.increase}`);
    pendingSubmitIds.delete(String(id));
    refresh(false);
  }else{
    pendingSubmitIds.delete(String(id));
    toast(t('couldNotSubmit') + (res.error||t('unknownError')), true);

}

/* ============================= EDIT TAB: DRAG TO REORDER ============================= */
// Press-and-hold a card in the Edit tab to pick it up, then drag it to a
// new spot — the grid live-previews the new layout as you move it (every
// other card slides out of the way via the same FLIP technique used
// elsewhere in the app), and the new order is written back to the sheet
// the moment you let go. Order is completely independent per location:
// reordering while Bears is selected (top bar) only ever touches Bears'
// own Order column — Tangle and Parkway are untouched.
let dragReorder = null; // active drag session, or null when nothing's being dragged
let lastOrderCommitTime = 0; // guards the periodic auto-poll from racing a just-sent order write (see setInterval below)
const DRAG_LONG_PRESS_MS = 150;
const DRAG_MOVE_CANCEL_PX = 8;

document.addEventListener('pointerdown', (e)=>{
  if(currentTab!=='edit' || !editReorderMode) return;
  const cardEl = e.target.closest('#photoGrid .card[data-group-key]:not(.card-pending)');
  if(!cardEl) return;
  if(e.pointerType==='mouse' && e.button!==0) return; // left-click only for mouse

  const startX = e.clientX, startY = e.clientY;
  const pointerId = e.pointerId;
  let fired = false;
  const timer = setTimeout(()=>{ fired = true; beginDragReorder(cardEl, e); }, DRAG_LONG_PRESS_MS);

  const onMove = (ev)=>{
    if(ev.pointerId!==pointerId || fired) return;
    if(Math.abs(ev.clientX-startX)>DRAG_MOVE_CANCEL_PX || Math.abs(ev.clientY-startY)>DRAG_MOVE_CANCEL_PX){
      clearTimeout(timer);
      cleanup();
    }
  };
  const onUp = (ev)=>{
    if(ev.pointerId!==pointerId) return;
    if(!fired) clearTimeout(timer);
    cleanup();
  };
  function cleanup(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
});

function beginDragReorder(cardEl, e){
  if(dragReorder) return; // a drag session is already active — never start a second one for the same or an overlapping gesture
  if(locationFilter==='All'){
    toast(t('pickLocationForOrder'), true);
    return;
  }
  const grid = document.getElementById('photoGrid');
  if(!grid) return;
  const orderedKeys = Array.from(grid.querySelectorAll('.card[data-group-key]')).map(c=>c.dataset.groupKey);
  const startRect = cardEl.getBoundingClientRect();

  dragReorder = {
    key: cardEl.dataset.groupKey,
    orderedKeys,
    pointerId: e.pointerId,
    offsetX: e.clientX - startRect.left,
    offsetY: e.clientY - startRect.top,
    originLeft: startRect.left,
    originTop: startRect.top,
    lastX: e.clientX,
    lastY: e.clientY,
    lastReorderCheck: 0,
    autoScrolling: false // true while the grid is actively being auto-scrolled near an edge — see startAutoScroll/maybeReorderDuringDrag
  };

  hapticTap();
  cardEl.setPointerCapture(e.pointerId);
  cardEl.classList.add('dragging');
  cardEl.removeAttribute('onclick');
  positionDraggedCard(cardEl, e.clientX, e.clientY);
  cardEl.addEventListener('pointermove', onDragMove);
  cardEl.addEventListener('pointerup', onDragEnd);
  cardEl.addEventListener('pointercancel', onDragEnd);
  startAutoScroll();
}

// Auto-scrolls the grid while dragging near its top or bottom edge, so an
// item can be dragged all the way to the very start/end of a long list
// without needing to first scroll there separately. Runs its own
// requestAnimationFrame loop independent of pointermove — otherwise
// holding still right at the edge (a very natural thing to do) wouldn't
// scroll at all, since no new pointer events would be firing to drive it.
let autoScrollRAF = null;
function startAutoScroll(){
  if(autoScrollRAF) return; // already running
  function tick(){
    if(!dragReorder){ autoScrollRAF = null; return; }
    const scrollEl = document.querySelector('main.grid-area');
    if(scrollEl){
      // #uiShell (an ancestor of this element) is visually scaled via CSS
      // transform:scale() for the app's UI Scale setting. getBoundingClientRect()
      // returns VISUAL (post-transform) coordinates, but scrollTop operates
      // in the element's own UNSCALED coordinate space — mixing the two
      // directly compounds a small error every single frame, which is what
      // was causing the dragged card to drift further and further away
      // and eventually fly off-screen the longer auto-scroll ran.
      const uiScale = state.uiScale || 1;
      const rect = scrollEl.getBoundingClientRect();
      const threshold = 70; // px from the edge that starts auto-scrolling (visual space)
      const maxSpeed = 14; // desired VISUAL px per frame at full intensity
      const y = dragReorder.lastY;
      let visualDelta = 0;
      if(y < rect.top + threshold){
        visualDelta = -maxSpeed * Math.min(1, (rect.top + threshold - y) / threshold);
      }else if(y > rect.bottom - threshold){
        visualDelta = maxSpeed * Math.min(1, (y - (rect.bottom - threshold)) / threshold);
      }
      if(visualDelta !== 0){
        dragReorder.autoScrolling = true; // suppress reorder shuffling while the grid is actively scrolling — see maybeReorderDuringDrag
        const before = scrollEl.scrollTop;
        scrollEl.scrollTop = before + (visualDelta / uiScale); // convert the desired VISUAL speed into the element's own unscaled space
        const actualDelta = (scrollEl.scrollTop - before) * uiScale; // convert back to visual space to match originTop's coordinate space
        if(actualDelta !== 0){
          // The dragged card's origin was captured via getBoundingClientRect
          // at a specific scroll position — shift it by the same VISUAL
          // amount the container just scrolled, or the card would visibly
          // drift away from the finger as auto-scroll continues.
          dragReorder.originTop -= actualDelta;
          const activeCardEl = document.querySelector('.card.dragging');
          if(activeCardEl) positionDraggedCard(activeCardEl, dragReorder.lastX, dragReorder.lastY);
          // Deliberately NOT calling maybeReorderDuringDrag() here anymore.
          // While actively auto-scrolling, the grid is moving fast enough
          // underneath the finger that repeatedly re-checking and shuffling
          // neighbors just looked cluttered and confusing — cards kept
          // jumping out of the way over and over. Reordering resumes the
          // instant the finger moves away from the edge (see below).
        }
      }else{
        dragReorder.autoScrolling = false; // finger is no longer near an edge — normal reorder-on-hover resumes right away
      }
    }
    autoScrollRAF = requestAnimationFrame(tick);
  }
  autoScrollRAF = requestAnimationFrame(tick);
}

function positionDraggedCard(cardEl, clientX, clientY){
  // Divides by the current UI Scale for the same reason the Resupply row
  // FLIP animation does — this element lives inside #uiShell, which is
  // itself visually scaled via CSS transform, so a raw on-screen pixel
  // offset needs correcting before being applied as this element's OWN
  // transform, or the movement would be scaled twice.
  const uiScale = state.uiScale || 1;
  const dx = (clientX - dragReorder.offsetX - dragReorder.originLeft) / uiScale;
  const dy = (clientY - dragReorder.offsetY - dragReorder.originTop) / uiScale;
  cardEl.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;
}

function onDragMove(e){
  if(!dragReorder || e.pointerId!==dragReorder.pointerId) return;
  e.preventDefault();
  dragReorder.lastX = e.clientX;
  dragReorder.lastY = e.clientY;
  const cardEl = e.currentTarget;
  positionDraggedCard(cardEl, e.clientX, e.clientY); // always smooth — tracks the finger every single frame, unthrottled
  maybeReorderDuringDrag();
}

// Reordering the grid itself is throttled and separate from the visual
// follow above. pointermove can fire 60-120+ times a second — recomputing
// and re-rendering the WHOLE grid on every single one of those caused
// visible thrashing (cards jumping around rapidly). A short cooldown
// between reorder checks keeps the drag feeling smooth while only
// actually reshuffling the other cards a few times a second. Called from
// onDragMove (finger actively moving) — deliberately NOT called from the
// auto-scroll loop, since reordering while the grid is actively scrolling
// looked cluttered (cards kept jumping out of the way repeatedly); see
// dragReorder.autoScrolling below.
function maybeReorderDuringDrag(){
  if(!dragReorder || dragReorder.autoScrolling) return; // never reorder while the grid is actively auto-scrolling
  const now = performance.now();
  if(now - dragReorder.lastReorderCheck < 220) return;
  dragReorder.lastReorderCheck = now;

  // Hit-test: only reorder when the pointer is genuinely OVER another
  // card's box, rather than "nearest by distance". Nearest-by-distance is
  // unstable in a wrapping multi-column grid — small movements near a
  // boundary can flip between two different neighbors, which is what was
  // causing a drop to land one slot off from wherever you actually
  // released it. Shrunk to the CENTER 60% of each card (not its full
  // edge-to-edge box) — hovering right at the boundary between two cards
  // was flipping the match back and forth on every check; requiring the
  // pointer to be well inside a card, not just barely over its edge, adds
  // hysteresis so a slow hover near a seam doesn't cause rapid flapping.
  const grid = document.getElementById('photoGrid');
  if(!grid) return;
  const cardEl = document.querySelector('.card.dragging');
  if(!cardEl) return;
  let target = null;
  grid.querySelectorAll('.card[data-group-key]').forEach(el=>{
    if(el===cardEl || target) return;
    const r = el.getBoundingClientRect();
    const insetX = r.width * 0.2, insetY = r.height * 0.2;
    if(dragReorder.lastX>=r.left+insetX && dragReorder.lastX<=r.right-insetX && dragReorder.lastY>=r.top+insetY && dragReorder.lastY<=r.bottom-insetY) target = el;
  });
  if(!target) return;
  const fromIndex = dragReorder.orderedKeys.indexOf(dragReorder.key);
  const toIndex = dragReorder.orderedKeys.indexOf(target.dataset.groupKey);
  if(fromIndex===-1 || toIndex===-1 || fromIndex===toIndex) return;

  const newOrder = dragReorder.orderedKeys.slice();
  newOrder.splice(fromIndex, 1);
  newOrder.splice(toIndex, 0, dragReorder.key);
  dragReorder.orderedKeys = newOrder;
  renderReorderPreview(cardEl);
}

function renderReorderPreview(cardEl){
  // Reorders the grid to match the dragged-to order. Every card except the
  // one actually being dragged gets FLIP-animated from its old spot to its
  // new one; the dragged card keeps following the pointer directly.
  const grid = document.getElementById('photoGrid');
  if(!grid || !dragReorder) return;
  const before = {};
  const existingByKey = {};
  grid.querySelectorAll('.card[data-group-key]').forEach(el=>{
    existingByKey[el.dataset.groupKey] = el;
    if(el===cardEl) return;
    const r = el.getBoundingClientRect();
    before[el.dataset.groupKey] = { left:r.left, top:r.top };
  });

  // MOVE the existing card elements into their new order rather than
  // destroying and recreating them via innerHTML. appendChild on a node
  // that's already in the document relocates it, it doesn't clone it —
  // so every card's <img> stays the exact same element throughout a whole
  // drag session. Rebuilding fresh <img> tags on every single reorder
  // step (previously: every ~220ms while shuffling cards) was forcing a
  // real reload each time on iOS Safari, which evicts decoded image data
  // far more aggressively than most browsers — that's what was showing up
  // as a ~2 second flash whenever anything moved.
  const byKey = {};
  allGroups().forEach(g=>{ byKey[g.key]=g; });
  dragReorder.orderedKeys.forEach(k=>{
    const existing = existingByKey[k];
    if(existing){
      grid.appendChild(existing); // moves, does not clone/recreate
    }else if(byKey[k]){
      grid.insertAdjacentHTML('beforeend', cardHtml(byKey[k])); // defensive fallback, shouldn't normally happen mid-reorder
    }
  });

  const newCardEl = existingByKey[dragReorder.key] || grid.querySelector(`.card[data-group-key="${CSS.escape(dragReorder.key)}"]`);
  if(newCardEl){
    // This is the SAME node from before this call (just moved, not
    // recreated), so its pointermove/pointerup/pointercancel listeners —
    // attached back in beginDragReorder — are still fully intact.
    newCardEl.classList.add('dragging');
    // Defensively re-request pointer capture. appendChild on a node that's
    // ALREADY a child of the target (which is exactly what's happening on
    // every reorder step) technically removes-then-reinserts it per the
    // DOM spec, even though it happens synchronously within the same
    // parent — some browsers treat that as the element being "removed",
    // which silently drops pointer capture. Once capture is gone, this
    // card stops receiving pointermove/pointerup at all: it looks frozen
    // in place, releasing your finger never fires onDragEnd, and
    // dragReorder never gets reset to null — which is exactly why every
    // subsequent drag attempt then does nothing until a full reload.
    try{ newCardEl.setPointerCapture(dragReorder.pointerId); }catch(err){}
    // The dragged card still has its OLD transform applied from following
    // the finger before this reorder — getBoundingClientRect() reflects
    // the CURRENT VISUAL (transformed) position, not where the card
    // naturally sits at its new spot in the grid. Clearing the transform
    // FIRST, before measuring, is what makes this actually "fresh": the
    // browser never gets a chance to paint the momentarily-untransformed
    // state, since it's replaced by a new transform in the very next line.
    newCardEl.style.transform = 'none';
    const freshRect = newCardEl.getBoundingClientRect();
    dragReorder.originLeft = freshRect.left;
    dragReorder.originTop = freshRect.top;
    positionDraggedCard(newCardEl, dragReorder.lastX, dragReorder.lastY);
  }

  requestAnimationFrame(()=>{
    const uiScale = state.uiScale || 1;
    grid.querySelectorAll('.card[data-group-key]').forEach(el=>{
      if(el===newCardEl) return;
      const b = before[el.dataset.groupKey];
      if(!b) return;
      const r = el.getBoundingClientRect();
      const dx = (b.left - r.left) / uiScale, dy = (b.top - r.top) / uiScale;
      if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
      // The jiggle animation (reorder mode) and this slide both animate
      // `transform` — a CSS animation re-asserts its own value every
      // single frame, which was overriding the slide's translate() almost
      // immediately and making the whole thing look like an instant snap
      // instead of a smooth motion. Pausing jiggle just for the duration
      // of this one card's slide fixes it; the CSS class puts it right
      // back once the transition settles.
      el.style.animation = 'none';
      el.style.transition = 'none';
      el.style.transform = `translate(${dx}px, ${dy}px)`;
      requestAnimationFrame(()=>{
        el.style.transition = 'transform 0.32s cubic-bezier(0.4,0,0.2,1)';
        el.style.transform = 'translate(0,0)';
        setTimeout(()=>{ el.style.animation = ''; }, 340); // hands jiggle back to the CSS class once the slide has visibly settled
      });
    });
  });
}

// Drops the visual "being dragged" state on a card without a full
// render() — the grid's DOM is already in the correct final order by this
// point (nodes were moved into place during the drag itself, never
// rebuilt), so all that's actually left to do is stop following the
// pointer and let it settle into its slot via normal layout.
function settleDraggedCard(cardEl){
  if(!cardEl) return;
  cardEl.classList.remove('dragging');
  cardEl.style.transform = '';
  cardEl.style.transition = '';
}
async function onDragEnd(e){
  if(!dragReorder || e.pointerId!==dragReorder.pointerId) return;
  const cardEl = e.currentTarget;
  cardEl.removeEventListener('pointermove', onDragMove);
  cardEl.removeEventListener('pointerup', onDragEnd);
  cardEl.removeEventListener('pointercancel', onDragEnd);
  const { orderedKeys } = dragReorder;
  const code = locationFilter;
  dragReorder = null;

  // Commit: assign fresh sequential order values (spaced by 10, leaving
  // room to slot new items in later without renumbering everything) to
  // every group currently in view, written to every size row in each one.
  const byKey = {};
  allGroups().forEach(g=>{ byKey[g.key]=g; });
  const updates = [];
  orderedKeys.forEach((key, i)=>{
    const g = byKey[key];
    if(!g) return;
    Object.values(g.rows).forEach(r=>{
      updates.push({ id:r.ID, order:i*10 });
    });
  });

  pushUndoSnapshot(updates.map(u=>u.id)); // snapshot BEFORE the optimistic mutation below, so Undo restores the pre-drag order
  updates.forEach(u=>{
    const row = rows.find(r=>sameId(r.ID,u.id));
    if(row) row[ORDER_FIELD_BY_CODE[code]] = u.order; // optimistic local update
  });

  settleDraggedCard(cardEl); // drop the dragging visual state immediately — the grid is already in the correct order (moved during the drag, not rebuilt), so no need for a full render() here
  toast(t('savingOrder'));
  const res = await apiPost({ action:'setGroupOrder', location:code, updates });
  if(res.ok){
    lastOrderCommitTime = Date.now();
    toast(t('orderSaved'));
    // Deliberately NOT calling refresh() here. The write and this popup's
    // eventual read are two separate requests with no guaranteed instant
    // consistency between them — re-fetching right away could occasionally
    // land before the write has fully settled server-side, which showed up
    // as the just-dragged item snapping back to its old spot until the
    // NEXT drag's refresh finally picked up the real data. The optimistic
    // local update above is already correct; the next natural refresh
    // (auto-poll or another action) will confirm it.
  }else{
    toast(t('saveFailed') + (res.error||t('unknownError')), true);
    refresh(false); // the write failed — the optimistic local state may be wrong, so resync with the server's real data
  }
}

async function submitEditGroup(){
  const groups = allGroups();
  const g = groups.find(x=>x.key===editingGroupKey);
  if(!g) return;
  const name = document.getElementById('editName').value.trim();
  const type = document.getElementById('editType').value.trim();
  const duplicate = findDuplicateItemGroup(name, type, editingGroupKey);
  if(duplicate){ toast(t('duplicateItemError'), true); return; }
  const matchIds = Object.values(g.rows).map(r=>r.ID);
  pushUndoSnapshot(matchIds);
  const locCodes = Array.from(document.querySelectorAll('#editLocPicker .loc-row.on')).map(el=>el.dataset.code);
  const location = LOCS.filter(l=>locCodes.includes(l.code)).map(l=>l.code).join('');

  const body = { action:'saveItem', matchIds, name, type, location };
  if(type === HOODIE_TYPE){
    const priceEl = document.getElementById('editHoodiePrice');
    const hoodiePrice = priceEl ? Number(priceEl.value||0) : 0;
    const hoodieSizes = Array.from(document.querySelectorAll('#editSizesSection .chip[data-hoodie-size].on')).map(el=>el.dataset.hoodieSize);
    if(hoodieSizes.length===0){ toast(t('pickHoodieSize')); return; }
    body.hoodiePrice = hoodiePrice;
    body.hoodieSizes = hoodieSizes;
  }else{
    const sizes = {};
    SIZES.forEach(s=>{
      sizes[s] = {};
      LOCS.forEach(l=>{
        const el = document.getElementById('editSize-'+l.code+'-'+s);
        sizes[s][l.code] = el ? Number(el.value||0) : 0;
      });
    });
    body.sizes = sizes;
  }

  const photoToSend = pendingPhotoBase64; // capture before closeSheet() clears it
  matchIds.forEach(id=>pendingSubmitIds.add(String(id)));
  closeSheet();
  render(); // immediately dims/disables the card(s) — a Type/Location change here can move them out of the current filtered view
  toast(t('saving'));
  if(photoToSend) body.photoBase64 = photoToSend;
  const res = await apiPost(body);
  if(res.ok) toast(t('saved')); else toast(t('saveFailed') + (res.error||t('unknownError')), true);
  matchIds.forEach(id=>pendingSubmitIds.delete(String(id)));
  refresh(false);
}
// Deactivating/reactivating only ever flips the Active column — the sheet
// data for that item's rows is never removed by the web app.
function confirmSetActive(key, makeActive){
  const groups = allGroups();
  const g = groups.find(x=>x.key===key);
  if(!g) return;
  openSheetHtml(makeActive ? `
    <h2>${t('reactivateTitle')} "${esc(g.name)}"?</h2>
    <div class="desc">${t('reactivateBody')}</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()">${t('cancel')}</button>
      <button class="btn btn-ok" onclick="submitSetActive('${esc(key)}',true)">${t('reactivate')}</button>
    </div>` : `
    <h2>${t('deactivateTitle')} "${esc(g.name)}"?</h2>
    <div class="desc">${t('deactivateBody')}</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()">${t('cancel')}</button>
      <button class="btn btn-danger" onclick="submitSetActive('${esc(key)}',false)">${t('deactivate')}</button>
    </div>`);
}
async function submitSetActive(key, makeActive){
  const groups = allGroups();
  const g = groups.find(x=>x.key===key);
  if(!g) return;
  const ids = Object.values(g.rows).map(r=>r.ID);
  pushUndoSnapshot(ids);
  ids.forEach(id=>pendingSubmitIds.add(String(id)));
  closeSheet();
  render(); // immediately dims/disables the card(s) on the now-visible grid
  toast(makeActive ? t('reactivating') : t('deactivating'));
  for(const id of ids){ await apiPost({action:'setActive', id, active:makeActive}); }
  toast(makeActive ? t('reactivated') : t('deactivatedToast'));
  ids.forEach(id=>pendingSubmitIds.delete(String(id)));
  refresh(false);
}

document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  toast(t('processingPhoto'));
  try{
    const dataUrl = await compressImage(file, 900, 0.72);
    pendingPhotoBase64 = dataUrl;
    const box = document.getElementById('uploadBox');
    if(box) box.innerHTML = `<img src="${dataUrl}">`;
    toast(t('photoReady'));
  }catch(err){
    pendingPhotoBase64 = null;
    toast(t('photoError') + err + t('photoErrorSuffix'), true);
  }
  e.target.value = '';
});
async function compressImage(file, maxW, quality){
  // createImageBitmap with imageOrientation:'from-image' decodes the photo
  // with its EXIF rotation already applied — the old approach (drawing a
  // plain <img> onto a canvas) ignores that flag entirely, which is what
  // caused re-uploaded photos to come out sideways / wrong aspect ratio.
  if (typeof createImageBitmap === 'function') {
    let bitmap;
    try{
      bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    }catch(err){
      return compressImageFallback(file, maxW, quality);
    }
    try{
      const scale = Math.min(1, maxW/bitmap.width);
      const w = Math.round(bitmap.width*scale), h = Math.round(bitmap.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      bitmap.close();
      return canvas.toDataURL('image/jpeg', quality);
    }catch(err){
      throw 'could not process image: ' + err;
    }
  }
  return compressImageFallback(file, maxW, quality);
}
// Fallback for browsers without createImageBitmap support — same as before.
function compressImageFallback(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const timeout = setTimeout(()=>reject('timed out — unsupported format'), 8000);
    const reader = new FileReader();
    reader.onerror = ()=>{ clearTimeout(timeout); reject('could not read file'); };
    reader.onload = (ev)=>{
      const img = new Image();
      img.onerror = ()=>{ clearTimeout(timeout); reject('unsupported image format'); };
      img.onload = ()=>{
        clearTimeout(timeout);
        try{
          const scale = Math.min(1, maxW/img.width);
          const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(err){ reject('could not process image: '+err); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let editReorderMode = false;
// Toggling reorder mode on/off used to go through the full render(), which
// rebuilds every card's <img> from scratch even though the same items in
// the same order are still being shown — just their jiggle/tap behavior
// changes. That rebuild was forcing a visible reload on iOS Safari every
// single time the Edit button was pressed. This updates only what
// actually changed, in place, on the existing elements.
function applyReorderModeToggle(){
  document.querySelector('.nav-item[data-tab="edit"]').classList.toggle('reorder-active', editReorderMode);
  const main = document.getElementById('main');
  main.classList.toggle('reorder-mode', editReorderMode);
  const grid = document.getElementById('photoGrid');
  if(grid){
    grid.querySelectorAll('.card[data-group-key]').forEach(el=>{
      if(editReorderMode){
        el.style.animationDelay = `-${(Math.random()*0.26).toFixed(2)}s`;
        el.removeAttribute('onclick'); // tapping shouldn't open the item while reorder mode is on — only dragging should work
      }else{
        el.style.animationDelay = '';
        el.setAttribute('onclick', "openGroup('" + esc(el.dataset.groupKey) + "')"); // matches cardHtml()'s own onclick exactly
      }
    });
  }
  const hintEl = document.querySelector('#main .desc');
  if(hintEl && locationFilter!=='All'){
    hintEl.textContent = `${t(editReorderMode?'dragHintOn':'dragHintOff')} ${LOC_NAME_BY_CODE[locationFilter]}`;

}
document.querySelector('nav.bottomnav').addEventListener('click', (e)=>{

});

  pendingHapticsEnabled = on;
  document.getElementById('hapticsOnChip').classList.toggle('on', on);
  document.getElementById('hapticsOffChip').classList.toggle('on', !on);
  if(on) hapticTap(); // immediate buzz so you can feel the setting take effect
}
function setDefaultTabPreview(tabName){
  pendingDefaultTab = tabName;
  document.getElementById('defaultTabDisplayChip').classList.toggle('on', tabName==='display');
  document.getElementById('defaultTabStorageChip').classList.toggle('on', tabName==='storage');
  document.getElementById('defaultTabResupplyChip').classList.toggle('on', tabName==='resupply');
}
function previewUiScale(value){
  const v = Math.max(0.3, Math.min(1.2, Number(value)||1));
  document.documentElement.style.setProperty('--ui-scale', String(v));
  const label = document.getElementById('uiScaleValue');
  if(label) label.textContent = Math.round(v*100)+'%';
}
function adjustUiScale(delta){
  const range = document.getElementById('uiScaleRange');
  const current = Number(range ? range.value : state.uiScale || 1);
  const v = Math.max(0.3, Math.min(1.2, Math.round((current+delta)*20)/20));
  if(range) range.value = v;
  previewUiScale(v);
}
function submitSettings(){
  state.apiUrl = document.getElementById('setUrl').value.trim();
  const range = document.getElementById('uiScaleRange');
  if(range) state.uiScale = Math.max(0.3, Math.min(1.2, Number(range.value)||1));
  if(pendingHapticsEnabled!==null) state.hapticsEnabled = pendingHapticsEnabled;
  pendingHapticsEnabled = null;
  if(pendingDefaultTab!==null) state.defaultTab = pendingDefaultTab;
  pendingDefaultTab = null;
  applyUiScale();
  saveState(); closeSheet(); refresh(true);
}

/* ============================= TOAST POSITION ============================= */
// Toast now sits just under the header instead of over the bottom nav
// (was getting in the way of the nav bar / thumb reach). The header lives
// inside #uiShell, which is visually scaled via CSS transform for the UI
// Scale setting — offsetHeight still returns the untransformed layout
// height, so this stays correct at any scale without needing to recompute
// on scale changes; only re-measured on load/resize for safety.
function updateToastPosition(){
  const header = document.querySelector('header.topbar');
  if(header) document.documentElement.style.setProperty('--toast-top', (header.offsetHeight + 10) + 'px');
}
window.addEventListener('resize', updateToastPosition);

/* ============================= HAPTICS ============================= */
// Short buzz on tap, Android Chrome only — iOS Safari/PWA has no Vibration
// API support at all, so this silently does nothing there. Toggleable in
// Settings; defaults to on.
function hapticTap(){
  if(state.hapticsEnabled===false) return;
  if(navigator.vibrate) navigator.vibrate(12);
}
// One delegated listener covers every button/card/chip/nav-item as they're
// re-rendered, instead of wiring vibration into each individual onclick.
document.addEventListener('click', (e)=>{
  const el = e.target.closest(
    'button, .card, .chip, .nav-item, .top-btn, .side-cat, .loc-row, ' +
    '.rotate-btn, .session-refresh-btn, .size-plus, .size-minus, .rq-minus, .rq-plus, .scale-btn, .size-loc-tab:not(.disabled), .btn-new-wide, .resupply-collapsed-row'
  );
  if(el) hapticTap();
}, true);

/* ============================= INIT ============================= */
applyUiScale();
applyLanguage();
updateToastPosition();
render();
refresh(false);
setInterval(()=>{
  if(document.hidden || dragReorder) return;
  // A recently-committed drag-reorder write and this poll's read are two
  // separate requests with no guaranteed instant consistency between them
  // — polling too soon after a commit could occasionally catch a stale
  // read and visibly revert the just-moved item until the NEXT refresh,
  // even though the write itself succeeded (confirmed by reopening the
  // app later, which always showed the correct final position). A short
  // grace period after any order commit avoids racing that window.
  if(Date.now() - lastOrderCommitTime < 5000) return;
  refresh(false);
}, 20000);
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
</script>
