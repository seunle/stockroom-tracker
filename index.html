<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stockroom Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C4257">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE6; --paper-raised:#FBF9F4; --ink:#25241F; --ink-soft:#6B655A;
    --line:#DAD3C2; --thread:#3E5C76; --thread-dark:#2C4257;
    --ok:#4C7A5D; --ok-bg:#E4EEE6; --low:#C2801F; --low-bg:#F7E9D3;
    --restock:#AE4239; --restock-bg:#F5DEDA;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    display:flex; flex-direction:column; height:100vh;
  }
  h1,h2,.tab-label,.side-cat,.stamp{font-family:'Oswald',system-ui,sans-serif;}
  ::-webkit-scrollbar{width:0;height:0;}

  /* ---------- Top bar ---------- */
  header.topbar{
    background:var(--thread-dark); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; gap:8px;
  }
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-mark{
    width:30px;height:30px;border:2px solid #fff;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald';font-weight:700;font-size:11px;transform:rotate(-8deg);flex-shrink:0;
  }
  .brand-text .name{font-size:13px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;line-height:1.1;}
  .brand-text .sync{font-size:9.5px;color:#C7D2DB;letter-spacing:0.5px;}
  .top-actions{display:flex;align-items:center;gap:8px;}
  .top-btn{
    background:rgba(255,255,255,0.10); border:1.5px solid rgba(255,255,255,0.28); color:#fff;
    font-family:'Oswald'; font-weight:600; font-size:11.5px; letter-spacing:0.6px; text-transform:uppercase;
    padding:9px 13px; border-radius:9px; display:flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .top-btn.new-btn{background:#fff;color:var(--thread-dark);border-color:#fff;}
  .top-btn.icon-only{padding:9px 10px; font-size:16px;}
  .top-btn:active{opacity:0.75;}

  /* ---------- Body layout: sidebar + main ---------- */
  .body-wrap{flex:1; display:flex; overflow:hidden;}
  aside.sidebar{
    width:88px; flex-shrink:0; background:var(--paper-raised);
    border-right:1.5px solid var(--line); overflow-y:auto;
    display:flex; flex-direction:column;
  }
  .side-cat{
    padding:14px 6px; text-align:center; font-size:12px; font-weight:600;
    letter-spacing:0.4px; text-transform:uppercase; color:var(--ink-soft);
    border-bottom:1.5px solid var(--line); line-height:1.25; position:relative;
  }
  .side-cat.active{background:var(--thread); color:#fff;}
  .side-cat .rm{
    position:absolute; top:3px; right:3px; width:16px;height:16px;border-radius:50%;
    background:rgba(0,0,0,0.15); color:#fff; font-size:10px; line-height:16px; display:none;
  }
  .sidebar.edit-mode .side-cat .rm{display:block;}
  .side-add{
    padding:12px 6px; text-align:center; font-size:20px; color:var(--ink-soft); flex-shrink:0;
  }
  .side-editbtn{
    padding:9px 4px; text-align:center; font-size:9.5px; font-weight:600; letter-spacing:0.5px;
    text-transform:uppercase; color:var(--thread); border-top:1.5px solid var(--line); margin-top:auto; flex-shrink:0;
  }

  main.grid-area{flex:1; overflow-y:auto; padding:12px 10px 90px; position:relative;}
  .grid-toolbar{display:flex; align-items:center; justify-content:space-between; margin:2px 4px 10px;}
  .grid-title{font-size:12px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-soft);}
  .scale-ctrl{display:flex;align-items:center;gap:4px;}
  .scale-btn{
    width:26px;height:26px;border-radius:7px;background:var(--paper-raised);border:1.5px solid var(--line);
    font-size:14px;font-weight:700;color:var(--thread-dark);
  }

  .photo-grid{
    display:grid; gap:9px;
    grid-template-columns:repeat(var(--cols,4), 1fr);
  }
  .card{
    background:var(--paper-raised); border:1.5px solid var(--line); border-radius:12px;
    overflow:hidden; position:relative; aspect-ratio:1/1.12;
    display:flex; flex-direction:column;
  }
  .card .photo{
    flex:1; background:var(--line); display:flex;align-items:center;justify-content:center;
    overflow:hidden; color:var(--ink-soft); font-size:22px;
  }
  .card .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .cap{padding:6px 7px 7px; font-size:11px; font-weight:700; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .status-dot{
    position:absolute; top:6px; right:6px; width:12px;height:12px;border-radius:50%;
    border:2px solid var(--paper-raised);
  }
  .status-dot.ok{background:var(--ok);} .status-dot.low{background:var(--low);} .status-dot.restock{background:var(--restock);}
  .card .loc-tag{
    position:absolute; top:6px; left:6px; background:rgba(37,36,31,0.65); color:#fff;
    font-family:'Oswald'; font-size:9px; font-weight:600; letter-spacing:0.5px;
    padding:2px 6px; border-radius:6px;
  }

  .empty-state{text-align:center;padding:60px 24px;color:var(--ink-soft);}
  .empty-state .ic{
    width:60px;height:60px;border:2.5px dashed var(--line);border-radius:50%;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--line);transform:rotate(-6deg);
  }
  .empty-state .big{font-family:'Oswald';font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;color:var(--ink-soft);}
  .empty-state p{font-size:13px;line-height:1.5;margin:0;max-width:260px;margin:0 auto;}

  /* ---------- Bottom nav ---------- */
  nav.bottomnav{
    position:fixed; left:0; right:0; bottom:0; background:var(--paper-raised);
    border-top:1.5px solid var(--line); display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:20;
  }
  .nav-item{flex:1; text-align:center; padding:9px 2px 6px; color:var(--ink-soft);}
  .nav-item .tab-label{font-size:11.5px; font-weight:600; letter-spacing:0.6px; text-transform:uppercase;}
  .nav-item.active{color:var(--thread-dark); background:var(--paper); border-radius:10px;}

  /* ---------- Overlay / sheet ---------- */
  .overlay{position:fixed;inset:0;background:rgba(37,36,31,0.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.show{display:flex;}
  .sheet{
    background:var(--paper-raised); width:100%; max-width:560px; border-radius:16px;
    padding:18px; max-height:90vh; overflow-y:auto; position:relative;
  }
  .sheet-close{
    position:absolute; top:12px; right:12px; width:30px;height:30px;border-radius:50%;
    background:var(--restock); color:#fff; font-size:16px; font-weight:700; border:none;
  }
  .sheet h2{font-size:16px;margin:0 0 4px;text-transform:uppercase;letter-spacing:0.5px;padding-right:34px;}
  .sheet .desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:9px;
    padding:10px 11px;font-size:14.5px;font-family:'Inter';color:var(--ink);
  }
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    padding:8px 13px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .chip.on{background:var(--thread);border-color:var(--thread);color:#fff;}
  .sheet-actions{display:flex;gap:10px;margin-top:8px;}
  .btn{font-family:'Inter';font-weight:600;font-size:13px;border:none;border-radius:9px;padding:11px 14px;flex:1;}
  .btn-primary{background:var(--thread);color:#fff;}
  .btn-ghost{background:transparent;color:var(--thread);border:1.5px solid var(--thread);}
  .btn-danger{background:var(--restock);color:#fff;}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn:active{opacity:0.75;}

  .upload-box{
    border:2px dashed var(--line); border-radius:12px; height:120px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px;
    color:var(--ink-soft); font-size:12px; font-weight:600; overflow:hidden; position:relative; background:var(--paper);
  }
  .upload-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  /* item detail popup, per sketch */
  .detail-wrap{display:flex; gap:16px;}
  .detail-photo{width:120px;height:150px;border-radius:10px;overflow:hidden;background:var(--line);flex-shrink:0;}
  .detail-photo img{width:100%;height:100%;object-fit:cover;}
  .size-grid{flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  .size-col{text-align:center;}
  .size-label{font-family:'Oswald';font-weight:700;font-size:13px;margin-bottom:5px;}
  .size-plus,.size-minus{
    width:100%; border-radius:7px; border:1.5px solid var(--line); background:var(--paper);
    font-size:16px; font-weight:800; padding:4px 0;
  }
  .size-plus{color:var(--ok); border-color:var(--ok);}
  .size-minus{color:var(--restock); border-color:var(--restock); margin-top:5px;}
  .size-count{font-size:19px;font-weight:800;padding:6px 0;}
  .size-count.low{color:var(--low);}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;
    z-index:60;pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1;}
  .connect-banner{background:var(--low-bg);border:1.5px solid var(--low);color:#7A5116;border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin:0 4px 14px;}
  .connect-banner b{display:block;font-size:13px;margin-bottom:3px;}
  .loc-picker{display:flex;flex-direction:column;gap:8px;}
  .loc-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);}
  .loc-row .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
  .loc-row.on .chk{background:var(--thread);border-color:var(--thread);}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">SR</div>
    <div class="brand-text">
      <div class="name">Stockroom</div>
      <div class="sync" id="lastSync">Not connected</div>
    </div>
  </div>
  <div class="top-actions">
    <button class="top-btn new-btn" id="btnNew">+ New</button>
    <button class="top-btn" id="btnLocation">All Locs</button>
    <button class="top-btn icon-only" id="btnUndo" title="Undo last action">↺</button>
    <button class="top-btn icon-only" id="btnSettings" title="Settings">⚙</button>
  </div>
</header>

<div class="body-wrap">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="grid-area" id="main"></main>
</div>

<nav class="bottomnav">
  <div class="nav-item" data-tab="display"><div class="tab-label">Display</div></div>
  <div class="nav-item" data-tab="storage"><div class="tab-label">Storage</div></div>
  <div class="nav-item" data-tab="resupply"><div class="tab-label">Resupply</div></div>
  <div class="nav-item" data-tab="edit"><div class="tab-label">Edit</div></div>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" id="fileInput" style="display:none;">

<script>
/* ============================= STATE ============================= */
const LS_KEY = 'stockroom_tracker_v3';
const LOCS = [{code:'T',name:'Tangle'},{code:'P',name:'Parkway'},{code:'B',name:'Bears'}];
const SIZES = ['S','M','L','XL','XXL'];
const STAGE_COL = { display:'Display', storage:'Storage', resupply:'Resupply' }; // maps tab -> sheet column

let state = loadState();
let rows = [];              // flat rows from the sheet
let currentTab = 'display';
let locationFilter = 'All'; // 'All' | 'T' | 'P' | 'B'
let categoryFilter = 'All';
let sidebarEditMode = false;
let pendingPhotoBase64 = null;
let filePickerTarget = null; // 'add' | 'edit'
let editingGroupKey = null;
let undoStack = [];

function loadState(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { apiUrl:'', gridCols:4 };
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* ============================= API ============================= */
async function apiGet(){
  if(!state.apiUrl) return {ok:false,error:'no-url'};
  try{ const res = await fetch(state.apiUrl,{method:'GET'}); return await res.json(); }
  catch(e){ return {ok:false,error:String(e)}; }
}
async function apiPost(body){
  if(!state.apiUrl) return {ok:false,error:'no-url'};
  try{
    const res = await fetch(state.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    return await res.json();
  }catch(e){ return {ok:false,error:String(e)}; }
}

async function refresh(showToast){
  if(!state.apiUrl){ document.getElementById('lastSync').textContent='Not connected'; render(); return; }
  const res = await apiGet();
  if(res.ok){
    rows = res.items||[];
    document.getElementById('lastSync').textContent = 'Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    if(showToast) toast('Refreshed');
  }else{
    document.getElementById('lastSync').textContent = 'Sync failed';
    if(showToast) toast('Could not reach the sheet');
  }
  render();
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1700);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= GROUPING ============================= */
// One "item" on screen = all rows sharing Name + Type + Location.
function groupKey(r){ return r.Name+'|||'+r.Type+'|||'+r.Location; }
function buildGroups(list){
  const map = {};
  list.forEach(r=>{
    const k = groupKey(r);
    if(!map[k]) map[k] = { key:k, name:r.Name, type:r.Type, location:r.Location, photo:r.Photo, rows:{} };
    map[k].rows[r.Size] = r;
    if(r.Photo) map[k].photo = r.Photo;
  });
  return Object.values(map);
}
function activeRows(){ return rows.filter(r=>Number(r.Active)!==0); }
function categoriesList(){
  const set = new Set(activeRows().map(r=>r.Type).filter(Boolean));
  return Array.from(set).sort();
}
function matchesFilters(g){
  if(categoryFilter!=='All' && g.type!==categoryFilter) return false;
  if(locationFilter!=='All' && g.location.indexOf(locationFilter)===-1) return false;
  return true;
}
function groupStageTotal(g, stageCol){
  return Object.values(g.rows).reduce((sum,r)=>sum+Number(r[stageCol]||0),0);
}
function groupStatus(g){
  // Simple status for now: any size at 0 display = restock-red, any size <=1 = low-amber, else ok.
  const vals = Object.values(g.rows).map(r=>Number(r.Display||0));
  if(vals.some(v=>v===0)) return 'restock';
  if(vals.some(v=>v<=1)) return 'low';
  return 'ok';
}

/* ============================= RENDER ============================= */
function render(){
  renderSidebar();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.tab===currentTab));
  document.getElementById('btnLocation').textContent = locationFilter==='All' ? 'All Locs' : LOCS.find(l=>l.code===locationFilter).name;

  const main = document.getElementById('main');
  if(!state.apiUrl){
    main.innerHTML = `
      <div class="connect-banner"><b>Not connected yet</b>Tap the ⚙ icon in the top-right to enter your Apps Script URL.</div>
      <div class="empty-state"><div class="ic">⚙</div><div class="big">Connect your sheet</div>
      <p>Once connected, all three locations will share the same live inventory.</p></div>`;
    return;
  }

  let list = activeRows();
  let groups = buildGroups(list).filter(matchesFilters);

  main.innerHTML = `
    <div class="grid-toolbar">
      <div class="grid-title">${tabTitle()} <span style="color:var(--ink);font-weight:800;">${groups.length}</span></div>
      <div class="scale-ctrl">
        <button class="scale-btn" onclick="adjustScale(-1)">−</button>
        <button class="scale-btn" onclick="adjustScale(1)">+</button>
      </div>
    </div>
    <div class="photo-grid" id="photoGrid" style="--cols:${state.gridCols};"></div>
  `;
  const grid = document.getElementById('photoGrid');

  if(currentTab==='resupply'){
    groups = groups.filter(g => groupStatus(g)!=='ok');
  }

  if(groups.length===0){
    grid.outerHTML = emptyState();
    return;
  }

  grid.innerHTML = groups.map(g=>cardHtml(g)).join('');
}

function tabTitle(){
  return currentTab==='display' ? 'On Display' : currentTab==='storage' ? 'In Storage'
       : currentTab==='resupply' ? 'Needs Attention' : 'All Items';
}
function emptyState(){
  return `<div class="empty-state"><div class="ic">🏷️</div><div class="big">Nothing here yet</div>
    <p>${currentTab==='resupply' ? 'Nothing is flagged right now — all sizes look OK.' : 'Tap "+ New" up top to add your first item.'}</p></div>`;
}
function cardHtml(g){
  const status = groupStatus(g);
  const locBadge = locationFilter==='All' ? `<div class="loc-tag">${esc(g.location)}</div>` : '';
  const photo = g.photo ? `<img src="${esc(g.photo)}" loading="lazy">` : '👕';
  return `
    <div class="card" onclick="openGroup('${esc(g.key)}')">
      <div class="photo">${photo}</div>
      <div class="status-dot ${status}"></div>
      ${locBadge}
      <div class="cap">${esc(g.name)}</div>
    </div>`;
}

/* ============================= SIDEBAR ============================= */
function renderSidebar(){
  const el = document.getElementById('sidebar');
  el.classList.toggle('edit-mode', sidebarEditMode);
  const cats = categoriesList();
  let html = `<div class="side-cat ${categoryFilter==='All'?'active':''}" onclick="setCategory('All')">All</div>`;
  html += cats.map(c=>`
    <div class="side-cat ${categoryFilter===c?'active':''}" onclick="${sidebarEditMode?'':`setCategory('${esc(c)}')`}">
      ${esc(c)}${sidebarEditMode?`<div class="rm" onclick="event.stopPropagation();removeCategory('${esc(c)}')">×</div>`:''}
    </div>`).join('');
  html += `<div class="side-editbtn" onclick="sidebarEditMode=!sidebarEditMode;render();">${sidebarEditMode?'Done':'Edit'}</div>`;
  el.innerHTML = html;
}
function setCategory(c){ categoryFilter=c; render(); }
function removeCategory(c){
  // Categories are just distinct Type values — "removing" one means no active items use it.
  // We ask for confirmation since it deactivates every item currently in that category.
  const affected = activeRows().filter(r=>r.Type===c);
  if(affected.length===0){ render(); return; }
  openSheetHtml(`
    <h2>Remove "${esc(c)}"?</h2>
    <div class="desc">${affected.length} item/size row(s) use this category. Removing it will deactivate them (not delete) — you can restore from the sheet's Active column anytime.</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmRemoveCategory('${esc(c)}')">Deactivate all</button>
    </div>`);
}
async function confirmRemoveCategory(c){
  closeSheet();
  const ids = activeRows().filter(r=>r.Type===c).map(r=>r.ID);
  pushUndoSnapshot(ids);
  for(const id of ids){ await apiPost({action:'setActive', id, active:false}); }
  toast('Category removed');
  if(categoryFilter===c) categoryFilter='All';
  refresh(false);
}

/* ============================= LOCATION FILTER ============================= */
document.getElementById('btnLocation').addEventListener('click', ()=>{
  openSheetHtml(`
    <h2>Filter by location</h2>
    <div class="chiprow">
      <div class="chip ${locationFilter==='All'?'on':''}" onclick="pickLocationFilter('All')">All</div>
      ${LOCS.map(l=>`<div class="chip ${locationFilter===l.code?'on':''}" onclick="pickLocationFilter('${l.code}')">${l.name}</div>`).join('')}
    </div>`);
});
function pickLocationFilter(code){ locationFilter=code; closeSheet(); render(); }

/* ============================= UNDO ============================= */
// Snapshots the current full state of the given IDs before a mutation, so
// Undo can restore it. IDs not currently in `rows` are recorded as "new"
// (undo = delete). Local to this device only.
function pushUndoSnapshot(ids){
  const snap = ids.map(id=>{
    const existing = rows.find(r=>r.ID===id);
    return existing ? {...existing} : {ID:id, __wasNew:true};
  });
  undoStack.push(snap);
  if(undoStack.length>20) undoStack.shift();
}
document.getElementById('btnUndo').addEventListener('click', async ()=>{
  const snap = undoStack.pop();
  if(!snap){ toast('Nothing to undo'); return; }
  toast('Undoing…');
  for(const s of snap){
    if(s.__wasNew){ await apiPost({action:'deleteRow', id:s.ID}); }
    else{ await apiPost({action:'restoreRow', ...s}); }
  }
  toast('Undone');
  refresh(false);
});

/* ============================= GRID SCALE ============================= */
function adjustScale(d){
  state.gridCols = Math.max(2, Math.min(6, state.gridCols+d));
  saveState(); render();
}

/* ============================= SHEET (MODAL) HELPERS ============================= */
function openSheetHtml(html){
  document.getElementById('sheetContent').innerHTML = `<button class="sheet-close" onclick="closeSheet()">×</button>` + html;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); pendingPhotoBase64=null; }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

/* ============================= ITEM DETAIL POPUP (Display/Storage/Resupply) ============================= */
function openGroup(key){
  const groups = buildGroups(activeRows());
  const g = groups.find(x=>x.key===key);
  if(!g) return;
  const stageCol = STAGE_COL[currentTab] || 'Display';
  openSheetHtml(`
    <h2>${esc(g.name)}</h2>
    <div class="desc">${esc(g.type)} · ${esc(g.location)} · editing <b>${currentTab}</b> counts</div>
    <div class="detail-wrap">
      <div class="detail-photo">${g.photo?`<img src="${esc(g.photo)}">`:''}</div>
      <div class="size-grid">
        ${SIZES.map(sz=>{
          const row = g.rows[sz];
          if(!row) return `<div class="size-col" style="opacity:0.3;"><div class="size-label">${sz}</div><div class="size-count">—</div></div>`;
          const val = Number(row[stageCol]||0);
          return `
            <div class="size-col">
              <div class="size-label">${sz}</div>
              <button class="size-plus" onclick="stepSize('${row.ID}',1,'${stageCol}')">+</button>
              <div class="size-count ${val<=1?'low':''}" id="cnt-${row.ID}">${val}</div>
              <button class="size-minus" onclick="stepSize('${row.ID}',-1,'${stageCol}')">−</button>
            </div>`;
        }).join('')}
      </div>
    </div>
    <div class="sheet-actions" style="margin-top:16px;">
      <button class="btn btn-primary" onclick="closeSheet();refresh(false);">Done</button>
    </div>
  `);
}
async function stepSize(id, delta, stageCol){
  const row = rows.find(r=>r.ID===id);
  if(!row) return;
  const newVal = Math.max(0, Number(row[stageCol]||0)+delta);
  pushUndoSnapshot([id]);
  row[stageCol] = newVal; // optimistic local update
  const el = document.getElementById('cnt-'+id);
  if(el){ el.textContent = newVal; el.classList.toggle('low', newVal<=1); }
  const action = stageCol==='Display' ? 'setDisplayCount' : null;
  if(action){
    await apiPost({action, id, value:newVal});
  }else{
    // Storage / Resupply columns: use restoreRow to write the single field.
    await apiPost({action:'restoreRow', ...row});
  }
}

/* ============================= NEW ITEM ============================= */
document.getElementById('btnNew').addEventListener('click', ()=>{
  if(!state.apiUrl){ toast('Connect your sheet first'); return; }
  openSheetHtml(`
    <h2>New item</h2>
    <div class="field">
      <label>Photo</label>
      <div class="upload-box" id="uploadBox" onclick="triggerFilePick('add')">
        <span id="uploadHint">Tap to add a photo</span>
      </div>
    </div>
    <div class="field"><label>Name</label><input type="text" id="newName" placeholder="e.g. Lean Meat"></div>
    <div class="field">
      <label>Type</label>
      <input type="text" id="newType" list="typeList" placeholder="e.g. Adult">
      <datalist id="typeList">${categoriesList().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    </div>
    <div class="field">
      <label>Locations</label>
      <div class="loc-picker" id="newLocPicker">
        ${LOCS.map(l=>`<div class="loc-row" data-code="${l.code}" onclick="toggleLocRow(this)"><span>${l.name}</span><span class="chk"></span></div>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>Starting counts by size</label>
      <div class="chiprow">
        ${SIZES.map(s=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <span style="font-size:10px;font-weight:700;color:var(--ink-soft);">${s}</span>
          <input type="number" id="newSize-${s}" value="0" style="width:52px;text-align:center;padding:8px 4px;">
        </div>`).join('')}
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewItem()">Add item</button>
    </div>
  `);
});
function toggleLocRow(el){ el.classList.toggle('on'); }
async function submitNewItem(){
  const name = document.getElementById('newName').value.trim();
  const type = document.getElementById('newType').value.trim();
  if(!name){ toast('Enter a name'); return; }
  if(!type){ toast('Enter a type'); return; }
  const locCodes = Array.from(document.querySelectorAll('#newLocPicker .loc-row.on')).map(el=>el.dataset.code);
  if(locCodes.length===0){ toast('Pick at least one location'); return; }
  const location = LOCS.filter(l=>locCodes.includes(l.code)).map(l=>l.code).join('');
  const sizes = {};
  SIZES.forEach(s=>{
    const v = Number(document.getElementById('newSize-'+s).value||0);
    if(v>0 || document.getElementById('newSize-'+s).value!=='') sizes[s]=v;
  });
  if(Object.keys(sizes).length===0){ toast('Set at least one size count'); return; }
  closeSheet();
  toast('Adding…');
  const body = { action:'addItem', name, type, location, sizes };
  if(pendingPhotoBase64) body.photoBase64 = pendingPhotoBase64;
  const res = await apiPost(body);
  if(res.ok){
    if(res.ids) pushUndoSnapshot(res.ids); // marks them as "new" for undo (rows not in local cache yet)
    toast('Item added');
    pendingPhotoBase64=null;
    refresh(false);
  }else{ toast('Could not add item'); }
}

/* ============================= EDIT TAB ============================= */
function openEditGroup(key){
  const groups = buildGroups(activeRows());
  const g = groups.find(x=>x.key===key);
  if(!g) return;
  editingGroupKey = key;
  const locCodesOn = LOCS.filter(l=>g.location.indexOf(l.code)!==-1).map(l=>l.code);
  openSheetHtml(`
    <h2>Edit item</h2>
    <div class="field">
      <label>Photo</label>
      <div class="upload-box" id="uploadBox" onclick="triggerFilePick('edit')">
        ${g.photo?`<img src="${esc(g.photo)}">`:'<span id="uploadHint">Tap to replace photo</span>'}
      </div>
    </div>
    <div class="field"><label>Name</label><input type="text" id="editName" value="${esc(g.name)}"></div>
    <div class="field">
      <label>Type</label>
      <input type="text" id="editType" list="typeList2" value="${esc(g.type)}">
      <datalist id="typeList2">${categoriesList().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    </div>
    <div class="field">
      <label>Locations</label>
      <div class="loc-picker" id="editLocPicker">
        ${LOCS.map(l=>`<div class="loc-row ${locCodesOn.includes(l.code)?'on':''}" data-code="${l.code}" onclick="toggleLocRow(this)"><span>${l.name}</span><span class="chk"></span></div>`).join('')}
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-danger" onclick="confirmDeleteGroup('${esc(key)}')">Delete</button>
      <button class="btn btn-primary" onclick="submitEditGroup()">Save</button>
    </div>
  `);
}
async function submitEditGroup(){
  const groups = buildGroups(activeRows());
  const g = groups.find(x=>x.key===editingGroupKey);
  if(!g) return;
  const matchIds = Object.values(g.rows).map(r=>r.ID);
  pushUndoSnapshot(matchIds);
  const name = document.getElementById('editName').value.trim();
  const type = document.getElementById('editType').value.trim();
  const locCodes = Array.from(document.querySelectorAll('#editLocPicker .loc-row.on')).map(el=>el.dataset.code);
  const location = LOCS.filter(l=>locCodes.includes(l.code)).map(l=>l.code).join('');
  closeSheet();
  toast('Saving…');
  const body = { action:'updateGroup', matchIds, name, type, location };
  if(pendingPhotoBase64) body.photoBase64 = pendingPhotoBase64;
  const res = await apiPost(body);
  pendingPhotoBase64=null;
  toast(res.ok?'Saved':'Could not save');
  refresh(false);
}
function confirmDeleteGroup(key){
  const groups = buildGroups(activeRows());
  const g = groups.find(x=>x.key===key);
  if(!g) return;
  openSheetHtml(`
    <h2>Delete "${esc(g.name)}"?</h2>
    <div class="desc">This removes all ${Object.keys(g.rows).length} size row(s) for this item. This can't be undone once you leave the app (local Undo will still work right after).</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-danger" onclick="submitDeleteGroup('${esc(key)}')">Delete</button>
    </div>`);
}
async function submitDeleteGroup(key){
  const groups = buildGroups(activeRows());
  const g = groups.find(x=>x.key===key);
  if(!g) return;
  const ids = Object.values(g.rows).map(r=>r.ID);
  pushUndoSnapshot(ids);
  closeSheet();
  toast('Deleting…');
  for(const id of ids){ await apiPost({action:'deleteRow', id}); }
  toast('Deleted');
  refresh(false);
}

/* ============================= PHOTO PICKER ============================= */
function triggerFilePick(target){
  filePickerTarget = target;
  document.getElementById('fileInput').click();
}
document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const dataUrl = await compressImage(file, 900, 0.72);
  pendingPhotoBase64 = dataUrl;
  const box = document.getElementById('uploadBox');
  if(box) box.innerHTML = `<img src="${dataUrl}">`;
  e.target.value = '';
});
function compressImage(file, maxW, quality){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=>{ currentTab = el.dataset.tab; render(); });
});

    <h2>Settings</h2>

    <div class="field"><label>Apps Script URL</label><input type="text" id="setUrl" value="${esc(state.apiUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div>

      <button class="btn btn-primary" onclick="submitSettings()">Save</button>

function submitSettings(){
  state.apiUrl = document.getElementById('setUrl').value.trim();
  state.gridCols = Math.max(2, Math.min(6, Number(document.getElementById('setCols').value||4)));
  saveState(); closeSheet(); refresh(true);

refresh(false);
setInterval(()=>{ if(!document.hidden) refresh(false); }, 20000);
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
